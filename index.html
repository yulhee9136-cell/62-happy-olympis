<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>소확행 올림픽</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>
<style>
  :root{
    --bg:#EAF6FF;
    --bg-deep:#D8EEFC;
    --ink:#1F3B57;
    --ink-soft:#5A7690;
    --sky:#3FA0DA;
    --sky-deep:#2C7FB0;
    --yellow:#FFD447;
    --yellow-deep:#D9A200;
    --green:#43A868;
    --green-deep:#2F8A50;
    --line: rgba(31,59,87,0.14);
    --bad:#C1493A;
    --ok:#2F8A50;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:'Gowun Dodum', sans-serif; min-height:100vh; }
  .screen{ display:none; padding:20px 18px 70px; max-width:760px; margin:0 auto; }
  .screen.active{ display:block; }
  h1,h2,h3{ margin:0; }
  .eyebrow{ font-size:13px; color:var(--sky-deep); font-weight:700; margin-bottom:6px; }
  .lede{ color:var(--ink-soft); font-size:14px; line-height:1.6; margin-top:8px; }

  #status-banner{ display:none; position:sticky; top:0; z-index:100; padding:10px 16px; font-size:14px; text-align:center; font-weight:700; }
  #status-banner.show{ display:block; }
  #status-banner.info{ background:#FFF3D6; color:#8A6A1F; }
  #status-banner.ok{ background:#E4F3E9; color:var(--ok); }
  #status-banner.bad{ background:#FBE6E1; color:var(--bad); }

  .clover-badge{
    position:fixed; top:14px; right:14px; z-index:90;
    background:#fff; border:2px solid var(--green); border-radius:20px;
    padding:8px 16px; font-weight:700; color:var(--green-deep); font-size:16px;
    box-shadow:0 3px 8px rgba(0,0,0,0.12); display:none; align-items:center; gap:6px;
  }
  .clover-badge.show{ display:flex; }

  .card{ background:#fff; border:2px solid var(--line); border-radius:14px; padding:20px 18px; margin-top:18px; }
  input[type=tel]{
    width:100%; font-family:'Gaegu', sans-serif; font-size:26px; letter-spacing:4px;
    padding:12px 10px; border:none; border-bottom:3px solid var(--line); background:transparent;
    color:var(--ink); outline:none; text-align:center;
  }
  input[type=tel]:focus{ border-bottom-color:var(--sky); }

  button{ font-family:'Gowun Dodum', sans-serif; font-weight:700; font-size:15px; padding:12px 22px; border:none; cursor:pointer; border-radius:24px; }
  .btn-primary{ background:var(--sky); color:#fff; }
  .btn-primary:hover{ background:var(--sky-deep); }
  .btn-primary:disabled{ background:#BFD6E4; cursor:not-allowed; }
  .btn-gold{ background:var(--yellow); color:#5A4300; }
  .btn-gold:hover{ background:var(--yellow-deep); color:#fff; }
  .btn-ghost{ background:transparent; color:var(--ink-soft); border:2px solid var(--line); }
  .actions{ display:flex; gap:12px; margin-top:22px; flex-wrap:wrap; }

  .code-confirm-name{ font-family:'Gaegu'; font-size:34px; color:var(--sky-deep); text-align:center; margin:18px 0 4px; }

  .round-badge{ display:inline-block; background:var(--ink); color:#fff; font-family:'Gaegu'; font-weight:700; font-size:16px; padding:6px 18px; border-radius:20px; }

  .rank-list{ margin-top:18px; }
  .rank-item{ display:flex; align-items:center; gap:12px; background:var(--bg-deep); border:2px solid transparent; border-radius:12px; padding:14px 16px; margin-bottom:10px; }
  .rank-num{ width:32px; height:32px; border-radius:50%; background:var(--sky); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:15px; flex-shrink:0; }
  .rank-text{ flex:1; font-size:16px; }
  .rank-arrows{ display:flex; flex-direction:column; gap:3px; }
  .arrow-btn{ background:#fff; border:2px solid var(--line); width:32px; height:28px; font-size:13px; padding:0; color:var(--ink); border-radius:6px; }
  .arrow-btn:disabled{ opacity:0.25; }

  .submit-list{ display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
  .submit-chip{ background:#fff; border:2px solid var(--sky); color:var(--sky-deep); border-radius:16px; padding:6px 14px; font-size:14px; font-weight:700; }

  .reveal-box{ background:#fff; border:3px solid var(--yellow); border-radius:16px; padding:20px; margin-top:18px; }
  .match-row{ display:flex; justify-content:space-between; padding:8px 4px; border-bottom:1px dashed var(--line); font-size:15px; }
  .match-row.hit{ color:var(--green-deep); font-weight:700; background:#EAF9EE; border-radius:8px; }

  .final-wrap{ text-align:center; margin-top:20px; }
  .clover-field{ display:flex; flex-wrap:wrap; justify-content:center; gap:6px; margin-top:20px; max-width:600px; margin-left:auto; margin-right:auto; }
  .clover-field span{ font-size:28px; animation: pop .4s ease; }
  @keyframes pop{ from{ transform:scale(0); opacity:0; } to{ transform:scale(1); opacity:1; } }

  .top-nav{ display:flex; justify-content:space-between; align-items:center; }
  .link-btn{ background:none; border:none; color:var(--ink-soft); font-size:13px; cursor:pointer; text-decoration:underline; padding:0; }

  .waiting-pulse{ display:inline-block; animation: pulse 1.4s infinite; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.4;} }

  .modal-bg{ display:none; position:fixed; inset:0; background:rgba(20,30,40,0.6); align-items:center; justify-content:center; padding:20px; z-index:150; }
  .modal-bg.active{ display:flex; }
  .modal-inner{ max-width:420px; width:100%; max-height:90vh; overflow:auto; text-align:center; }
  .modal-x-close{ position:fixed; top:18px; right:18px; width:42px; height:42px; border-radius:50%; background:#fff; border:2px solid var(--line); font-size:20px; line-height:1; cursor:pointer; z-index:160; box-shadow:0 2px 8px rgba(0,0,0,0.15); }
  .qr-box{ background:#fff; border-radius:16px; padding:24px; }
  .qr-box img{ width:100%; max-width:340px; }
  .qr-link{ font-size:12px; color:var(--ink-soft); word-break:break-all; margin-top:10px; }

  .lang-bar{ display:flex; gap:8px; margin:12px 0 4px; }
  .lang-btn{ padding:6px 14px; border-radius:16px; border:2px solid var(--line); background:#fff; font-size:13px; cursor:pointer; color:var(--ink-soft); }
  .lang-btn.on{ background:var(--sky); color:#fff; border-color:var(--sky); }

  .pool-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:10px; margin-top:14px; }
  .item-card{ background:#fff; border:2px solid var(--sky); border-radius:14px; padding:12px 10px; text-align:center; cursor:grab; touch-action:none; user-select:none; -webkit-user-select:none; }
  .item-card .emo{ font-size:30px; line-height:1; }
  .item-card .kw{ font-weight:700; font-size:14px; margin-top:4px; color:var(--ink); }
  .item-card .full{ font-size:11px; color:var(--ink-soft); margin-top:4px; line-height:1.35; }
  .item-card.empty-slot-placeholder{ border-style:dashed; border-color:var(--line); background:transparent; cursor:default; min-height:78px; display:flex; align-items:center; justify-content:center; }
  .item-card.empty-slot-placeholder .ph-text{ color:var(--line); font-size:12px; }

  .slots-col{ display:flex; flex-direction:column; gap:10px; margin-top:18px; }
  .slot{ display:flex; align-items:center; gap:12px; border:3px dashed var(--sky); border-radius:14px; padding:10px 14px; min-height:60px; background:var(--bg-deep); transition: background .15s, border-color .15s; }
  .slot.filled{ border-style:solid; border-color:var(--green); background:#fff; }
  .slot.drag-over{ background:#FFF6D8; border-color:var(--yellow-deep); }
  .slot .slot-num{ width:30px; height:30px; border-radius:50%; background:var(--ink); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:13px; flex-shrink:0; }
  .slot .slot-content{ flex:1; display:flex; align-items:center; gap:10px; cursor:grab; touch-action:none; }
  .slot .slot-content .emo{ font-size:22px; }
  .slot .slot-content .kw{ font-weight:700; font-size:14px; }
  .slot .slot-empty-text{ color:var(--ink-soft); font-size:13px; }
  .slot .remove-btn{ background:none; border:none; color:var(--bad); font-size:20px; cursor:pointer; padding:2px 6px; }

  .drag-ghost{ position:fixed; pointer-events:none; z-index:200; opacity:0.95; transform:scale(1.06) rotate(-2deg); box-shadow:0 8px 20px rgba(0,0,0,0.25); }
</style>
</head>
<body>

<div id="status-banner"></div>
<div class="clover-badge" id="clover-badge">🍀 <span id="clover-count">0</span></div>

<!-- 0. 접속코드 -->
<div class="screen active" id="screen-code">
  <div class="eyebrow">국어 · 행복 발견하기</div>
  <h1 style="font-family:'Gaegu'; font-size:36px; color:var(--sky-deep);">🔥 소확행 올림픽</h1>
  <p class="lede">선생님이 알려주신 접속코드를 입력해주세요.</p>
  <div class="card">
    <input type="tel" id="input-code" placeholder="0000" maxlength="4" inputmode="numeric">
    <div class="actions" style="justify-content:center;">
      <button class="btn-primary" onclick="checkCode()">확인</button>
    </div>
  </div>
</div>

<!-- 0-1. 본인 확인 -->
<div class="screen" id="screen-confirm">
  <div class="card" style="text-align:center;">
    <p class="lede" style="margin-top:0;">이 접속코드는</p>
    <div class="code-confirm-name" id="confirm-name">-</div>
    <p class="lede">님의 코드가 맞나요?</p>
    <div class="actions" style="justify-content:center;">
      <button class="btn-primary" onclick="confirmYes()">예, 맞아요</button>
      <button class="btn-ghost" onclick="confirmNo()">아니오</button>
    </div>
  </div>
</div>

<!-- 1. 학생 게임 화면 -->
<div class="screen" id="screen-student">
  <div class="top-nav">
    <span class="round-badge" id="student-round-badge">1 라운드</span>
    <button class="link-btn" onclick="logout()">로그아웃</button>
  </div>
  <div id="student-body" style="margin-top:16px;"></div>
</div>

<!-- 2. 교사 진행 화면 -->
<div class="screen" id="screen-teacher">
  <div class="top-nav">
    <span class="round-badge" id="teacher-round-badge">1 라운드</span>
    <div style="display:flex; gap:8px;">
      <button class="btn-ghost" onclick="showQR()">📱 QR 띄우기</button>
      <button class="btn-ghost" style="border-color:var(--bad); color:var(--bad);" onclick="askReset()">🔄 초기화</button>
      <button class="link-btn" onclick="logout()">로그아웃</button>
    </div>
  </div>
  <h2 style="font-family:'Gaegu'; color:var(--sky-deep); margin-top:10px;">교사 진행 화면</h2>
  <div id="teacher-body" style="margin-top:10px;"></div>
</div>

<!-- QR 모달 -->
<div class="modal-bg" id="qr-modal-bg" onclick="closeQrIfBg(event)">
  <button class="modal-x-close" onclick="closeQr()" aria-label="닫기">✕</button>
  <div class="modal-inner">
    <div class="qr-box" id="qr-box-content"></div>
  </div>
</div>

<!-- 초기화 확인 모달 -->
<div class="modal-bg" id="reset-confirm-bg">
  <div class="modal-inner">
    <div class="card" style="text-align:center;">
      <p class="lede" style="margin-top:0; font-size:16px;">정말 초기화할까요?<br>모든 라운드 기록과 클로버가 삭제되고, 1라운드부터 다시 시작돼요.</p>
      <div class="actions" style="justify-content:center;">
        <button class="btn-ghost" style="border-color:var(--bad); color:var(--bad);" onclick="doReset()">초기화</button>
        <button class="btn-ghost" onclick="closeResetConfirm()">취소</button>
      </div>
    </div>
  </div>
</div>

<!-- 3. 최종 화면 -->
<div class="screen" id="screen-final">
  <div class="final-wrap">
    <div class="eyebrow" style="text-align:center;">3라운드 완료!</div>
    <h1 style="font-family:'Gaegu'; font-size:34px; color:var(--sky-deep);">협동으로 모은 우리 반의 행운</h1>
    <p class="lede" id="final-summary">불러오는 중...</p>
    <div class="clover-field" id="clover-field"></div>
    <div class="actions" style="justify-content:center;">
      <button class="btn-ghost" onclick="logout()">처음으로</button>
    </div>
  </div>
</div>

let uiLang = 'ko';

// ---------- 효과음 (Web Audio API, 파일 없이 직접 생성) ----------
let audioCtx = null;
function ensureAudio(){ if(!audioCtx){ try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return audioCtx; }
function tone(freq, start, dur, type, gain){
  const ctx = ensureAudio(); if(!ctx) return;
  const osc = ctx.createOscillator(); const g = ctx.createGain();
  osc.type = type||'sine'; osc.frequency.value = freq;
  g.gain.setValueAtTime(0, ctx.currentTime+start);
  g.gain.linearRampToValueAtTime(gain||0.15, ctx.currentTime+start+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+start+dur);
  osc.connect(g); g.connect(ctx.destination);
  osc.start(ctx.currentTime+start); osc.stop(ctx.currentTime+start+dur+0.05);
}
function sfxSubmit(){ tone(880,0,0.12,'triangle',0.12); }
function sfxPlace(){ tone(600,0,0.09,'triangle',0.12); }
function sfxReveal(){
  [220,260,300,340,500,700].forEach((f,i)=> tone(f, i*0.09, 0.15, 'square', 0.09));
}
function sfxClover(){
  [660,880,1100,1320].forEach((f,i)=> tone(f, i*0.06, 0.18, 'sine', 0.1));
}

// ---------- 세션 ----------
let session = null; // {code, name, isTeacher}
let pendingCode = null;

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}

function checkCode(){
  const code = document.getElementById('input-code').value.trim();
  if(!/^\d{4}$/.test(code)){ showStatus('4자리 숫자 코드를 입력해주세요.', 'bad', 2500); return; }
  const name = CODES[code];
  if(!name){ showStatus('등록되지 않은 코드예요.', 'bad', 3000); return; }
  pendingCode = code;
  document.getElementById('confirm-name').textContent = name;
  showScreen('screen-confirm');
}
function confirmYes(){
  const code = pendingCode;
  session = { code, name: CODES[code], isTeacher: code === TEACHER_CODE };
  document.getElementById('input-code').value = '';
  if(session.isTeacher){
    showScreen('screen-teacher');
    initTeacher();
  }else{
    document.getElementById('clover-badge').classList.add('show');
    showScreen('screen-student');
    initStudent();
  }
}
function confirmNo(){ pendingCode=null; document.getElementById('input-code').value=''; showScreen('screen-code'); }
function logout(){
  session = null;
  detachAllListeners();
  document.getElementById('clover-badge').classList.remove('show');
  showScreen('screen-code');
}

let listeners = [];
function track(ref, event){ listeners.push({ref, event}); }
function detachAllListeners(){ listeners.forEach(l=> l.ref.off(l.event)); listeners = []; }

// ================= 학생 로직 =================
let studentState = { round:1, assign:[null,null,null,null,null], resultShown:{} };

function initStudent(){
  const gameRef = db.ref(`${ROOT}/game/currentRound`);
  track(gameRef, 'value');
  gameRef.on('value', snap=>{
    const r = snap.val() || 1;
    if(r === 'final'){ showFinalForEveryone(); return; }
    document.getElementById('student-round-badge').textContent = `${r} 라운드`;
    loadStudentRound(r);
  });
  refreshMyCloverBadge();
}

function loadStudentRound(r){
  studentState = { round:r, assign:[null,null,null,null,null], resultShown:{} };

  const subRef = db.ref(`${ROOT}/rounds/${r}/submissions/${session.code}`);
  const revealRef = db.ref(`${ROOT}/rounds/${r}/reveal`);
  Promise.all([subRef.once('value'), revealRef.once('value')]).then(([subSnap, revealSnap])=>{
    const mySub = subSnap.val();
    const reveal = revealSnap.val();
    if(mySub){ studentState.assign = mySub.order.slice(); }
    if(reveal){
      renderStudentReveal(r, reveal, mySub);
    }else if(mySub){
      renderStudentWaiting(r);
    }else{
      renderStudentRankingUI(r);
    }
    if(!reveal){
      const rr = db.ref(`${ROOT}/rounds/${r}/reveal`);
      track(rr, 'value');
      rr.on('value', s=>{
        const rv = s.val();
        if(rv && studentState.round === r){
          db.ref(`${ROOT}/rounds/${r}/submissions/${session.code}`).once('value').then(ss=>{
            renderStudentReveal(r, rv, ss.val());
          });
        }
      });
    }
  });
}

// ---------- 랭킹 화면 (드래그 앤 드롭) ----------
function renderStudentRankingUI(r){
  const body = document.getElementById('student-body');
  body.innerHTML = `
    <h2 style="font-family:'Gaegu'; color:var(--sky-deep);">${SETS[r-1].label}</h2>
    <p class="lede">카드를 아래 순위 칸으로 끌어다 놓아보세요. 1위가 가장 행복한 것이에요!</p>
    <div class="lang-bar" id="lang-bar"></div>
    <div class="pool-grid" id="pool-grid"></div>
    <div class="slots-col" id="slots-col"></div>
    <div class="actions"><button class="btn-primary" id="submit-rank-btn" disabled onclick="submitRank()">제출하기</button></div>
  `;
  renderLangBar();
  renderPoolAndSlots();
}
function renderLangBar(){
  const bar = document.getElementById('lang-bar');
  if(!bar) return;
  const langs = [['ko','한국어'],['ru','Русский'],['zh','中文']];
  bar.innerHTML = langs.map(([code,label])=>`<button class="lang-btn ${uiLang===code?'on':''}" onclick="setLang('${code}')">${label}</button>`).join('');
}
function setLang(code){ uiLang = code; renderLangBar(); renderPoolAndSlots(); }

function itemCardInner(r, idx){
  const obj = SETS[r-1].items[idx];
  if(uiLang==='ko'){
    return `<div class="emo">${obj.emoji}</div><div class="kw">${obj.keyword}</div><div class="full">${obj.text}</div>`;
  }
  const t = (TRANSLATIONS[uiLang][r-1] && TRANSLATIONS[uiLang][r-1][idx]) || obj.text;
  return `<div class="emo">${obj.emoji}</div><div class="full" style="font-size:13px; margin-top:6px;">${t}</div>`;
}

function renderPoolAndSlots(){
  const r = studentState.round;
  const poolGrid = document.getElementById('pool-grid');
  const slotsCol = document.getElementById('slots-col');
  if(!poolGrid || !slotsCol) return;

  poolGrid.innerHTML = '';
  for(let idx=0; idx<5; idx++){
    const placedAt = studentState.assign.indexOf(idx);
    const card = document.createElement('div');
    if(placedAt !== -1){
      card.className = 'item-card empty-slot-placeholder';
      card.innerHTML = `<span class="ph-text">${placedAt+1}위에 놓임</span>`;
    }else{
      card.className = 'item-card';
      card.innerHTML = itemCardInner(r, idx);
      makeDraggable(card, { origIdx: idx, fromSlot: null });
    }
    poolGrid.appendChild(card);
  }

  slotsCol.innerHTML = '';
  for(let rank=0; rank<5; rank++){
    const idx = studentState.assign[rank];
    const slot = document.createElement('div');
    slot.className = 'slot' + (idx!==null? ' filled':'');
    slot.dataset.rank = rank;
    if(idx!==null){
      slot.innerHTML = `
        <div class="slot-num">${rank+1}</div>
        <div class="slot-content">${itemCardInner(r, idx)}</div>
        <button class="remove-btn" onclick="removeFromSlot(${rank})">✕</button>`;
      makeDraggable(slot.querySelector('.slot-content'), { origIdx: idx, fromSlot: rank });
    }else{
      slot.innerHTML = `<div class="slot-num">${rank+1}</div><div class="slot-empty-text">여기로 끌어다 놓으세요</div>`;
    }
    slotsCol.appendChild(slot);
  }
  updateSubmitButton();
}
function removeFromSlot(rank){ studentState.assign[rank] = null; renderPoolAndSlots(); }
function updateSubmitButton(){
  const btn = document.getElementById('submit-rank-btn');
  if(!btn) return;
  btn.disabled = studentState.assign.some(v=>v===null);
}

// ---------- 드래그 앤 드롭 (Pointer Events — 터치/마우스 공용) ----------
function makeDraggable(el, payload){
  el.addEventListener('pointerdown', function(e){
    e.preventDefault();
    const r = studentState.round;
    const ghost = document.createElement('div');
    ghost.className = 'item-card drag-ghost';
    ghost.style.width = el.getBoundingClientRect().width + 'px';
    ghost.innerHTML = itemCardInner(r, payload.origIdx);
    document.body.appendChild(ghost);
    moveGhost(ghost, e.clientX, e.clientY);
    el.style.opacity = '0.25';

    function onMove(ev){
      moveGhost(ghost, ev.clientX, ev.clientY);
      highlightSlotAt(ev.clientX, ev.clientY);
    }
    function onUp(ev){
      document.removeEventListener('pointermove', onMove);
      ghost.remove();
      el.style.opacity = '';
      clearHighlights();
      const dropRank = findSlotRankAt(ev.clientX, ev.clientY);
      handleDrop(payload, dropRank);
    }
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp, { once:true });
  });
}
function moveGhost(ghost,x,y){ ghost.style.left = (x - ghost.offsetWidth/2)+'px'; ghost.style.top = (y - ghost.offsetHeight/2)+'px'; }
function findSlotRankAt(x,y){
  const el = document.elementFromPoint(x,y);
  if(!el) return null;
  const slotEl = el.closest('.slot');
  if(!slotEl) return null;
  return parseInt(slotEl.dataset.rank);
}
function highlightSlotAt(x,y){
  clearHighlights();
  const el = document.elementFromPoint(x,y);
  const slotEl = el && el.closest('.slot');
  if(slotEl) slotEl.classList.add('drag-over');
}
function clearHighlights(){ document.querySelectorAll('.slot.drag-over').forEach(s=>s.classList.remove('drag-over')); }
function handleDrop(payload, dropRank){
  if(dropRank === null){
    if(payload.fromSlot !== null) studentState.assign[payload.fromSlot] = null;
    renderPoolAndSlots();
    return;
  }
  if(payload.fromSlot === dropRank){ renderPoolAndSlots(); return; }
  const occupant = studentState.assign[dropRank];
  if(payload.fromSlot !== null) studentState.assign[payload.fromSlot] = occupant;
  studentState.assign[dropRank] = payload.origIdx;
  sfxPlace();
  renderPoolAndSlots();
}

async function submitRank(){
  const r = studentState.round;
  if(studentState.assign.some(v=>v===null)) return;
  const orderIdxs = studentState.assign.slice();
  try{
    await db.ref(`${ROOT}/rounds/${r}/submissions/${session.code}`).set({ name: session.name, order: orderIdxs, ts: Date.now() });
    sfxSubmit();
    renderStudentWaiting(r);
  }catch(e){ console.error(e); showStatus('제출 중 오류가 발생했어요.', 'bad'); }
}
function renderStudentWaiting(r){
  const body = document.getElementById('student-body');
  body.innerHTML = `
    <h2 style="font-family:'Gaegu'; color:var(--sky-deep);">${SETS[r-1].label}</h2>
    <div class="card" style="text-align:center;">
      <p class="lede waiting-pulse" style="font-size:16px;">✅ 제출 완료! 선생님이 마무리할 때까지 기다려주세요.</p>
    </div>
  `;
}
function renderStudentReveal(r, reveal, mySub){
  const body = document.getElementById('student-body');
  let matchHtml = '<p class="lede">이번 라운드는 제출을 못 했어요. 다음 라운드를 기다려주세요!</p>';
  let matchCount = 0;
  if(mySub){
    const rows = mySub.order.map((idx,pos)=>{
      const hit = reveal.order[pos] === idx;
      if(hit) matchCount++;
      const obj = SETS[r-1].items[idx];
      return { emoji:obj.emoji, keyword:obj.keyword, pos, hit };
    });
    matchHtml = `<div>${rows.map(row=>`<div class="match-row ${row.hit?'hit':''}">${row.pos+1}위 · ${row.emoji} ${row.keyword} ${row.hit?'🍀 일치!':''}</div>`).join('')}</div>`;
  }
  const revealList = reveal.order.map(idx=>{ const o=SETS[r-1].items[idx]; return `${o.emoji}${o.keyword}`; }).join(' → ');
  body.innerHTML = `
    <h2 style="font-family:'Gaegu'; color:var(--sky-deep);">${SETS[r-1].label}</h2>
    <div class="reveal-box">
      <p style="font-weight:700; color:var(--yellow-deep);">🎲 정답 학생: ${reveal.name}</p>
      <p class="lede" style="margin-bottom:10px;">순위: ${revealList}</p>
      ${matchHtml}
    </div>
    <p class="lede waiting-pulse" style="margin-top:14px;">선생님이 다음 라운드를 시작할 때까지 기다려주세요.</p>
  `;
  if(mySub && !studentState.resultShown[r]){
    studentState.resultShown[r] = true;
    sfxReveal();
    setTimeout(()=>{
      if(matchCount>0) sfxClover();
      db.ref(`${ROOT}/rounds/${r}/results/${session.code}`).set({ name: session.name, matchCount });
    }, 700);
  }
}
function refreshMyCloverBadge(){
  let total = {1:0,2:0,3:0};
  [1,2,3].forEach(r=>{
    const ref = db.ref(`${ROOT}/rounds/${r}/results/${session.code}`);
    track(ref, 'value');
    ref.on('value', snap=>{
      const v = snap.val();
      total[r] = v ? (v.matchCount||0) : 0;
      const sum = total[1]+total[2]+total[3];
      document.getElementById('clover-count').textContent = sum;
    });
  });
}

// ================= 교사 로직 =================
function initTeacher(){
  const gameRef = db.ref(`${ROOT}/game/currentRound`);
  track(gameRef, 'value');
  gameRef.on('value', snap=>{
    const r = snap.val();
    if(!r){ db.ref(`${ROOT}/game/currentRound`).set(1); return; }
    if(r === 'final'){ showFinalForEveryone(); return; }
    document.getElementById('teacher-round-badge').textContent = `${r} 라운드`;
    renderTeacherRound(r);
  });
}
function renderTeacherRound(r){
  const body = document.getElementById('teacher-body');
  body.innerHTML = `
    <div class="card">
      <h3 style="font-family:'Gaegu'; color:var(--sky-deep); font-size:20px;">${SETS[r-1].label}</h3>
      <ol style="padding-left:20px; color:var(--ink-soft); font-size:14px;">
        ${SETS[r-1].items.map(o=>`<li>${o.emoji} <b>${o.keyword}</b> — ${o.text}</li>`).join('')}
      </ol>
    </div>
    <div class="card">
      <h3 style="font-size:16px;">제출 현황 (<span id="submit-count">0</span>명)</h3>
      <div class="submit-list" id="submit-list"></div>
      <div class="actions">
        <button class="btn-gold" id="finalize-btn" onclick="finalizeRound(${r})">마무리하기 (정답 뽑기)</button>
      </div>
    </div>
    <div id="teacher-reveal-area"></div>
  `;
  const subRef = db.ref(`${ROOT}/rounds/${r}/submissions`);
  track(subRef, 'value');
  subRef.on('value', snap=>{
    const all = snap.val() || {};
    const names = Object.values(all).map(s=>s.name);
    document.getElementById('submit-count').textContent = names.length;
    document.getElementById('submit-list').innerHTML = names.map(n=>`<span class="submit-chip">${n}</span>`).join('') || '<span class="lede">아직 제출한 학생이 없어요.</span>';
  });
  const revealRef = db.ref(`${ROOT}/rounds/${r}/reveal`);
  track(revealRef, 'value');
  revealRef.on('value', snap=>{
    const rv = snap.val();
    const area = document.getElementById('teacher-reveal-area');
    const finalizeBtn = document.getElementById('finalize-btn');
    if(!area) return;
    if(rv){
      if(finalizeBtn) finalizeBtn.style.display = 'none';
      area.innerHTML = `
        <div class="reveal-box">
          <p style="font-weight:700; color:var(--yellow-deep);">🎲 이번 라운드 정답 학생: ${rv.name}</p>
          <p class="lede">순위: ${rv.order.map(idx=>{const o=SETS[r-1].items[idx]; return o.emoji+o.keyword;}).join(' → ')}</p>
        </div>
        <div class="actions">
          <button class="btn-primary" onclick="nextRound(${r})">${r<3? '다음 라운드로' : '전체 결과 보기'}</button>
        </div>`;
    }else{
      area.innerHTML = '';
      if(finalizeBtn) finalizeBtn.style.display = 'inline-block';
    }
  });
}
async function finalizeRound(r){
  const snap = await db.ref(`${ROOT}/rounds/${r}/submissions`).once('value');
  const all = snap.val() || {};
  const codes = Object.keys(all);
  if(codes.length === 0){ showStatus('아직 제출한 학생이 없어요.', 'bad', 2500); return; }
  const pickCode = codes[Math.floor(Math.random()*codes.length)];
  const pick = all[pickCode];
  await db.ref(`${ROOT}/rounds/${r}/reveal`).set({ code: pickCode, name: pick.name, order: pick.order });
}
async function nextRound(r){
  if(r < 3){
    await db.ref(`${ROOT}/game/currentRound`).set(r+1);
  }else{
    await db.ref(`${ROOT}/game/currentRound`).set('final');
  }
}

// ================= 최종 화면 =================
let finalShown = false;
async function showFinalForEveryone(){
  if(finalShown) return;
  finalShown = true;
  showScreen('screen-final');
  let total = 0;
  for(let r=1;r<=3;r++){
    const snap = await db.ref(`${ROOT}/rounds/${r}/results`).once('value');
    const all = snap.val() || {};
    Object.values(all).forEach(v=> total += (v.matchCount||0));
  }
  document.getElementById('final-summary').textContent = `우리 반이 함께 모은 네잎클로버는 총 ${total}개예요!`;
  const field = document.getElementById('clover-field');
  field.innerHTML = '';
  const n = Math.min(total, 200);
  for(let i=0;i<n;i++){
    setTimeout(()=>{
      const el = document.createElement('span');
      el.textContent = '🍀';
      field.appendChild(el);
    }, i*25);
  }
  sfxReveal();
  setTimeout(sfxClover, 500);
}

function closeResetConfirm(){ document.getElementById('reset-confirm-bg').classList.remove('active'); }

}
