<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>소확행 올림픽</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>
<style>
  :root{
    --bg:#EAF6FF;
    --bg-deep:#D8EEFC;
    --ink:#1F3B57;
    --ink-soft:#5A7690;
    --sky:#2E9BE0;
    --sky-deep:#1D6FA8;
    --yellow:#FFD93D;
    --yellow-deep:#C99400;
    --green:#22C55E;
    --green-deep:#159C46;
    --torch:#FF6A3D;
    --torch-deep:#E04E22;
    --red:#FF4D4D; --red-deep:#D93030;
    --orange:#FF9F40; --orange-deep:#E37D12;
    --blue:#3B82F6; --blue-deep:#1D4FD1;
    --line: rgba(31,59,87,0.14);
    --bad:#C1493A;
    --ok:#2F8A50;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:linear-gradient(180deg,#EAF6FF 0%,#F4FBFF 400px); color:var(--ink); font-family:'Gowun Dodum', sans-serif; min-height:100vh; }
  .screen{ display:none; padding:20px 18px 70px; max-width:760px; margin:0 auto; }
  .screen.active{ display:block; }
  h1,h2,h3{ margin:0; }
  .eyebrow{ font-size:13px; color:var(--sky-deep); font-weight:700; margin-bottom:6px; }
  .lede{ color:var(--ink-soft); font-size:14px; line-height:1.6; margin-top:8px; }

  @media (min-width: 1000px){
    #screen-teacher{ max-width:1400px; width:94%; padding-top:32px; }
    #screen-teacher h2{ font-size:28px; }
    #screen-teacher .card{ padding:30px 32px; }
    #screen-teacher .lede, #screen-teacher li{ font-size:17px; }
    #screen-teacher .round-badge{ font-size:20px; padding:10px 26px; }
    #screen-teacher .submit-chip{ font-size:16px; padding:8px 18px; }
    #screen-teacher button{ font-size:17px; padding:14px 26px; }
    #screen-teacher .reveal-box{ padding:28px; }
    #screen-teacher .reveal-box .lede{ font-size:18px; }
    #teacher-main-grid{ display:grid; grid-template-columns:1fr 1fr; gap:24px; align-items:start; }
  }

  .teacher-overlay{
    position:fixed; inset:0; z-index:300; display:none; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; color:#fff; overflow:hidden;
  }
  .teacher-overlay.active{ display:flex; }
  .overlay-bg-spin{
    position:absolute; inset:-20%; z-index:-1;
    background:conic-gradient(from 0deg, var(--red), var(--orange), var(--yellow), var(--green), var(--blue), var(--red));
    animation: spinBg 4s linear infinite; filter:blur(1px) brightness(0.85);
  }
  @keyframes spinBg{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }
  .overlay-dim{ position:absolute; inset:0; background:rgba(10,14,20,0.35); z-index:-1; }
  .suspense-text{ font-family:'Jua'; font-size:44px; text-shadow:0 4px 12px rgba(0,0,0,0.4); animation: pulse2 0.45s infinite; }
  @keyframes pulse2{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.12); } }
  .reveal-congrats{ font-family:'Jua'; font-size:30px; text-shadow:0 3px 10px rgba(0,0,0,0.35); }
  .reveal-name{ font-family:'Jua'; font-size:60px; margin-top:6px; text-shadow:0 4px 14px rgba(0,0,0,0.4); animation: pop2 .5s ease; }
  @keyframes pop2{ from{ transform:scale(0.3); opacity:0; } to{ transform:scale(1); opacity:1; } }
  .overlay-order{ background:rgba(255,255,255,0.94); color:var(--ink); border-radius:16px; padding:18px 24px; margin-top:22px; max-width:520px; }
  .overlay-order .lede{ color:var(--ink-soft); }
  .confetti-piece{ position:absolute; top:-40px; font-size:26px; animation:confettiFall linear forwards; z-index:2; }
  @keyframes confettiFall{ to{ transform:translateY(112vh) rotate(360deg); opacity:0.25; } }

  #status-banner{ display:none; position:sticky; top:0; z-index:100; padding:10px 16px; font-size:14px; text-align:center; font-weight:700; }
  #status-banner.show{ display:block; }
  #status-banner.info{ background:#FFF3D6; color:#8A6A1F; }
  #status-banner.ok{ background:#E4F3E9; color:var(--ok); }
  #status-banner.bad{ background:#FBE6E1; color:var(--bad); }

  .clover-badge{
    position:fixed; top:14px; right:14px; z-index:90;
    background:#fff; border:2px solid var(--green); border-radius:20px;
    padding:8px 16px; font-weight:700; color:var(--green-deep); font-size:16px;
    box-shadow:0 3px 8px rgba(0,0,0,0.12); display:none; align-items:center; gap:6px;
  }
  .clover-badge.show{ display:flex; }

  .sound-toggle{
    position:fixed; top:14px; left:14px; z-index:90;
    background:#fff; border:2px solid var(--line); border-radius:50%;
    width:42px; height:42px; display:none; align-items:center; justify-content:center;
    font-size:18px; cursor:pointer; box-shadow:0 3px 8px rgba(0,0,0,0.12);
  }
  .sound-toggle.show{ display:flex; }

  .card{ background:#fff; border:2px solid var(--line); border-radius:14px; padding:20px 18px; margin-top:18px; }
  input[type=tel]{
    width:100%; font-family:'Jua', sans-serif; font-size:26px; letter-spacing:4px;
    padding:12px 10px; border:none; border-bottom:3px solid var(--line); background:transparent;
    color:var(--ink); outline:none; text-align:center;
  }
  input[type=tel]:focus{ border-bottom-color:var(--sky); }

  button{ font-family:'Gowun Dodum', sans-serif; font-weight:700; font-size:15px; padding:12px 22px; border:none; cursor:pointer; border-radius:24px; }
  .btn-primary{ background:linear-gradient(135deg,var(--sky),var(--sky-deep)); color:#fff; box-shadow:0 4px 10px rgba(46,155,224,0.35); }
  .btn-primary:hover{ filter:brightness(1.06); }
  .btn-primary:disabled{ background:#BFD6E4; box-shadow:none; cursor:not-allowed; }
  .btn-gold{ background:linear-gradient(135deg,var(--yellow),var(--yellow-deep)); color:#5A4300; box-shadow:0 4px 10px rgba(217,162,0,0.35); }
  .btn-gold:hover{ filter:brightness(1.05); }
  .btn-ghost{ background:transparent; color:var(--ink-soft); border:2px solid var(--line); }
  .actions{ display:flex; gap:12px; margin-top:22px; flex-wrap:wrap; }

  .code-confirm-name{ font-family:'Jua'; font-size:34px; color:var(--sky-deep); text-align:center; margin:18px 0 4px; }

  .round-badge{ display:inline-block; background:linear-gradient(135deg,var(--torch),var(--torch-deep)); color:#fff; font-family:'Jua'; font-weight:700; font-size:16px; padding:6px 18px; border-radius:20px; box-shadow:0 3px 8px rgba(224,78,34,0.35); }

  .rank-list{ margin-top:18px; }
  .rank-item{ display:flex; align-items:center; gap:12px; background:var(--bg-deep); border:2px solid transparent; border-radius:12px; padding:14px 16px; margin-bottom:10px; }
  .rank-item[data-rank="0"]{ background:#FFE1E0; border-color:var(--red); }
  .rank-item[data-rank="1"]{ background:#FFEAD6; border-color:var(--orange); }
  .rank-item[data-rank="2"]{ background:#FFF6D2; border-color:var(--yellow); }
  .rank-item[data-rank="3"]{ background:#DFF7E6; border-color:var(--green); }
  .rank-item[data-rank="4"]{ background:#DCEBFF; border-color:var(--blue); }
  .rank-num{ width:34px; height:34px; border-radius:50%; background:var(--sky); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:15px; flex-shrink:0; }
  .rank-item[data-rank="0"] .rank-num{ background:var(--red-deep); }
  .rank-item[data-rank="1"] .rank-num{ background:var(--orange-deep); }
  .rank-item[data-rank="2"] .rank-num{ background:var(--yellow-deep); }
  .rank-item[data-rank="3"] .rank-num{ background:var(--green-deep); }
  .rank-item[data-rank="4"] .rank-num{ background:var(--blue-deep); }
  .rank-text{ flex:1; font-size:16px; }
  .rank-text b{ color:var(--ink); }
  .rank-arrows{ display:flex; flex-direction:column; gap:3px; }
  .arrow-btn{ background:#fff; border:2px solid var(--line); width:34px; height:30px; font-size:14px; padding:0; color:var(--ink); border-radius:8px; }
  .arrow-btn:disabled{ opacity:0.25; }

  .submit-list{ display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
  .submit-chip{ background:#fff; border:2px solid var(--sky); color:var(--sky-deep); border-radius:16px; padding:6px 14px; font-size:14px; font-weight:700; }

  .reveal-box{ background:#fff; border:3px solid var(--yellow); border-radius:16px; padding:20px; margin-top:18px; }
  .match-row{ display:flex; justify-content:space-between; padding:8px 4px; border-bottom:1px dashed var(--line); font-size:15px; }
  .match-row.hit{ color:var(--green-deep); font-weight:700; background:#EAF9EE; border-radius:8px; }

  .final-wrap{ text-align:center; margin-top:20px; }
  .clover-field{ display:flex; flex-wrap:wrap; justify-content:center; gap:6px; margin-top:20px; max-width:600px; margin-left:auto; margin-right:auto; }
  .clover-field span{ font-size:28px; animation: pop .4s ease; }
  @keyframes pop{ from{ transform:scale(0); opacity:0; } to{ transform:scale(1); opacity:1; } }

  .top-nav{ display:flex; justify-content:space-between; align-items:center; }
  .link-btn{ background:none; border:none; color:var(--ink-soft); font-size:13px; cursor:pointer; text-decoration:underline; padding:0; }

  .waiting-pulse{ display:inline-block; animation: pulse 1.4s infinite; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.4;} }

  .modal-bg{ display:none; position:fixed; inset:0; background:rgba(20,30,40,0.6); align-items:center; justify-content:center; padding:20px; z-index:150; }
  .modal-bg.active{ display:flex; }
  .modal-inner{ max-width:420px; width:100%; max-height:90vh; overflow:auto; text-align:center; }
  .modal-x-close{ position:fixed; top:18px; right:18px; width:42px; height:42px; border-radius:50%; background:#fff; border:2px solid var(--line); font-size:20px; line-height:1; cursor:pointer; z-index:160; box-shadow:0 2px 8px rgba(0,0,0,0.15); }
  .qr-box{ background:#fff; border-radius:16px; padding:24px; }
  .qr-box img{ width:100%; max-width:340px; }
  .qr-link{ font-size:12px; color:var(--ink-soft); word-break:break-all; margin-top:10px; }

  .lang-bar{ display:flex; gap:8px; margin:12px 0 4px; flex-wrap:wrap; }
  .lang-btn{ padding:6px 14px; border-radius:16px; border:2px solid var(--line); background:#fff; font-size:13px; cursor:pointer; color:var(--ink-soft); }
  .lang-btn.on{ background:var(--sky); color:#fff; border-color:var(--sky); }
</style>
</head>
<body>


<div id="status-banner"></div>
<div class="clover-badge" id="clover-badge">🍀 <span id="clover-count">0</span></div>
<button class="sound-toggle" id="sound-toggle" onclick="toggleSound()">🔊</button>

<!-- 0. 접속코드 -->
<div class="screen active" id="screen-code">
  <div class="eyebrow">국어 · 행복 발견하기</div>
  <h1 style="font-family:'Jua'; font-size:36px; color:var(--sky-deep);">🔥 소확행 올림픽</h1>
  <p class="lede">선생님이 알려주신 접속코드를 입력해주세요.</p>
  <div class="card">
    <input type="tel" id="input-code" placeholder="0000" maxlength="4" inputmode="numeric">
    <div class="actions" style="justify-content:center;">
      <button class="btn-primary" onclick="checkCode()">확인</button>
    </div>
  </div>
</div>

<!-- 0-1. 본인 확인 -->
<div class="screen" id="screen-confirm">
  <div class="card" style="text-align:center;">
    <p class="lede" style="margin-top:0;">이 접속코드는</p>
    <div class="code-confirm-name" id="confirm-name">-</div>
    <p class="lede">님의 코드가 맞나요?</p>
    <div class="actions" style="justify-content:center;">
      <button class="btn-primary" onclick="confirmYes()">예, 맞아요</button>
      <button class="btn-ghost" onclick="confirmNo()">아니오</button>
    </div>
  </div>
</div>

<!-- 1. 학생 게임 화면 -->
<div class="screen" id="screen-student">
  <div class="top-nav">
    <span class="round-badge" id="student-round-badge">1 라운드</span>
    <button class="link-btn" onclick="logout()">로그아웃</button>
  </div>
  <div id="student-body" style="margin-top:16px;"></div>
</div>

<!-- 2. 교사 진행 화면 -->
<div class="screen" id="screen-teacher">
  <div class="top-nav">
    <span class="round-badge" id="teacher-round-badge">1 라운드</span>
    <div style="display:flex; gap:8px;">
      <button class="btn-ghost" onclick="showQR()">📱 QR 띄우기</button>
      <button class="btn-ghost" style="border-color:var(--bad); color:var(--bad);" onclick="askReset()">🔄 초기화</button>
      <button class="link-btn" onclick="logout()">로그아웃</button>
    </div>
  </div>
  <h2 style="font-family:'Jua'; color:var(--sky-deep); margin-top:10px;">교사 진행 화면</h2>
  <div id="teacher-body" style="margin-top:10px;"></div>
</div>

<!-- 당첨 발표 전체화면 연출 -->
<div class="teacher-overlay" id="teacher-overlay">
  <div class="overlay-bg-spin"></div>
  <div class="overlay-dim"></div>
  <div id="overlay-content"></div>
</div>

<!-- QR 모달 -->
<div class="modal-bg" id="qr-modal-bg" onclick="closeQrIfBg(event)">
  <button class="modal-x-close" onclick="closeQr()" aria-label="닫기">✕</button>
  <div class="modal-inner">
    <div class="qr-box" id="qr-box-content"></div>
  </div>
</div>

<!-- 초기화 확인 모달 -->
<div class="modal-bg" id="reset-confirm-bg">
  <div class="modal-inner">
    <div class="card" style="text-align:center;">
      <p class="lede" style="margin-top:0; font-size:16px;">정말 초기화할까요?<br>모든 라운드 기록과 클로버가 삭제되고, 1라운드부터 다시 시작돼요.</p>
      <div class="actions" style="justify-content:center;">
        <button class="btn-ghost" style="border-color:var(--bad); color:var(--bad);" onclick="doReset()">초기화</button>
        <button class="btn-ghost" onclick="closeResetConfirm()">취소</button>
      </div>
    </div>
  </div>
</div>

<!-- 3. 최종 화면 -->
<div class="screen" id="screen-final">
  <div class="final-wrap">
    <div class="eyebrow" style="text-align:center;">3라운드 완료!</div>
    <h1 style="font-family:'Jua'; font-size:34px; color:var(--sky-deep);">협동으로 모은 우리 반의 행운</h1>
    <p class="lede" id="final-summary">불러오는 중...</p>
    <div class="clover-field" id="clover-field"></div>
    <div class="actions" style="justify-content:center;">
      <button class="btn-ghost" onclick="logout()">처음으로</button>
    </div>
  </div>
</div>

<script>
// ---------- Firebase 초기화 (행복은 시집서점과 같은 프로젝트, 다른 경로 사용) ----------
const firebaseConfig = {
  apiKey: "AIzaSyAfiyFuGadCypy-Yn1xgob6yCGyNg0_R6M",
  authDomain: "happy-library-269d6.firebaseapp.com",
  databaseURL: "https://happy-library-269d6-default-rtdb.firebaseio.com",
  projectId: "happy-library-269d6",
  storageBucket: "happy-library-269d6.firebasestorage.app",
  messagingSenderId: "1088280762466",
  appId: "1:1088280762466:web:5cabc8506a6feceda5593b"
};
let db = null;
try{ firebase.initializeApp(firebaseConfig); db = firebase.database(); }
catch(e){ console.error('Firebase 초기화 실패', e); }
function hasDb(){ return db !== null; }
const ROOT = 'sokwak'; // 이 앱 전용 데이터 경로 (시집서점 데이터와 안 섞이게)

function showStatus(msg, type, autoHideMs){
  const el = document.getElementById('status-banner');
  el.textContent = msg;
  el.className = 'show ' + (type||'info');
  if(autoHideMs){ clearTimeout(el._t); el._t = setTimeout(()=>el.classList.remove('show'), autoHideMs); }
}
window.addEventListener('DOMContentLoaded', ()=>{
  if(!hasDb()) showStatus('⚠️ 데이터베이스 연결 실패. 인터넷 연결을 확인해주세요.', 'bad');
});

// ---------- 접속코드 표 (행복은 시집서점과 동일) ----------
const CODES = {
  "6200":"교사",
  "6201":"김경민", "6202":"김용희", "6203":"김채민", "6204":"라지브", "6205":"발레리야",
  "6206":"박인학", "6207":"선은서", "6208":"안나래", "6209":"안시헌", "6210":"유예서",
  "6211":"이지석", "6212":"정우진", "6213":"정현우", "6214":"조아미르", "6215":"최선우",
  "6216":"함영채", "6217":"허준호", "6218":"홍다희", "6219":"홍승아", "6220":"어민성",
  "6221":"예비용1","6222":"예비용2","6223":"예비용3","6224":"예비용4","6225":"예비용5",
  "6226":"예비용6","6227":"예비용7","6228":"예비용8","6229":"예비용9","6230":"예비용10",
  "6231":"예비용11","6232":"예비용12","6233":"예비용13","6234":"예비용14","6235":"예비용15",
  "6236":"예비용16","6237":"예비용17","6238":"예비용18","6239":"예비용19","6240":"예비용20"
};
const TEACHER_CODE = "6200";

// ---------- 라운드 문항 (키워드+이모지 포함) ----------
const SETS = [
  { label:'세트 1 · 몸이 먼저 아는 행복', items:[
    { text:'눈썰매장에서 호호 불며 먹는 군고구마', keyword:'군고구마', emoji:'🍠' },
    { text:'물놀이하고 나와 먹는 시원한 컵라면', keyword:'컵라면', emoji:'🍜' },
    { text:'축구하다가 들이켜는 시원한 물 한 모금', keyword:'물 한 모금', emoji:'💧' },
    { text:'땀범벅 체육 끝나고 뜯는 아이스크림', keyword:'아이스크림', emoji:'🍦' },
    { text:'학교 앞에서 친구들과 같이 사먹는 떡볶이', keyword:'떡볶이', emoji:'🍡' }
  ]},
  { label:'세트 2 · 마음이 훅 따뜻해지는 순간', items:[
    { text:'부모님께서 나의 노력을 알아봐주실 때', keyword:'인정받기', emoji:'👏' },
    { text:'힘든 티도 안 냈는데 친구가 먼저 연락해올 때', keyword:'먼저 연락', emoji:'📱' },
    { text:'안 친한 줄 알았던 애가 내 생일 기억해줄 때', keyword:'생일 축하', emoji:'🎂' },
    { text:'준비물 깜빡했는데 짝꿍이 말없이 나눠줄 때', keyword:'나눔', emoji:'🤝' },
    { text:'오랜만에 만난 친구가 반갑게 손 흔들어줄 때', keyword:'반가움', emoji:'👋' }
  ]},
  { label:'세트 3 · 일상 속 작은 행복', items:[
    { text:'하루를 무사히 마치고 침대에 누웠을 때', keyword:'포근한 침대', emoji:'🛏️' },
    { text:'우연히 바라본 하늘이 아름다울 때', keyword:'예쁜 하늘', emoji:'🌅' },

// ---------- 효과음 & 배경음악 (Web Audio API, 파일 없이 직접 생성) ----------
let audioCtx = null;
let soundOn = true;
function ensureAudio(){ if(!audioCtx){ try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return audioCtx; }
function tone(freq, start, dur, type, gain){
  if(!soundOn) return;
  const ctx = ensureAudio(); if(!ctx) return;
  const osc = ctx.createOscillator(); const g = ctx.createGain();
  osc.type = type||'sine'; osc.frequency.value = freq;
  g.gain.setValueAtTime(0, ctx.currentTime+start);
  g.gain.linearRampToValueAtTime(gain||0.15, ctx.currentTime+start+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+start+dur);
  osc.connect(g); g.connect(ctx.destination);
  osc.start(ctx.currentTime+start); osc.stop(ctx.currentTime+start+dur+0.05);
}
function sfxSubmit(){ tone(880,0,0.12,'triangle',0.14); }
function sfxPlace(){ tone(700,0,0.08,'triangle',0.13); }
function sfxClover(){ [660,880,1100,1320].forEach((f,i)=> tone(f, i*0.06, 0.18, 'sine', 0.1)); }
function sfxFanfare(){
  const seq = [523,523,523,659,784,784,659,784,988,1319];
  seq.forEach((f,i)=> tone(f, i*0.16, 0.32, 'triangle', 0.14));
}
// 두구두구 드럼롤: 점점 빨라지다가 끝에 챙- 하는 효과 (특정 곡이 아닌 자체 제작 사운드)
function sfxDrumroll(totalMs, onDone){
  let elapsed = 0, interval = 220;
  function step(){
    if(elapsed >= totalMs){
      tone(200,0,0.05,'square',0.12); tone(300,0.05,0.05,'square',0.12); tone(500,0.1,0.3,'triangle',0.14);
      onDone && onDone();
      return;
    }
    tone(140 + Math.random()*25, 0, Math.min(interval/1000*0.85, 0.16), 'square', 0.09);
    elapsed += interval;
    interval = Math.max(45, interval*0.88);
    setTimeout(step, interval);
  }
  step();
}

let studentState = { round:1, order:null, resultShown:{} };

function initStudent(){
  const gameRef = db.ref(`${ROOT}/game/currentRound`);
  track(gameRef, 'value');
  gameRef.on('value', snap=>{
    const r = snap.val() || 1;
    if(r === 'final'){ showFinalForEveryone(); return; }
    document.getElementById('student-round-badge').textContent = `${r} 라운드`;
    loadStudentRound(r);
  });
  refreshMyCloverBadge();
}

function loadStudentRound(r){
  studentState = { round:r, order: [0,1,2,3,4], resultShown:{} };

  const subRef = db.ref(`${ROOT}/rounds/${r}/submissions/${session.code}`);
  const revealRef = db.ref(`${ROOT}/rounds/${r}/reveal`);
  Promise.all([subRef.once('value'), revealRef.once('value')]).then(([subSnap, revealSnap])=>{
    const mySub = subSnap.val();
    const reveal = revealSnap.val();
    if(mySub){ studentState.order = mySub.order.slice(); }
    if(reveal){
      renderStudentReveal(r, reveal, mySub);
    }else if(mySub){
      renderStudentWaiting(r);
    }else{
      renderStudentRankingUI(r);
    }
    if(!reveal){
      const rr = db.ref(`${ROOT}/rounds/${r}/reveal`);
      track(rr, 'value');
      rr.on('value', s=>{
        const rv = s.val();
        if(rv && studentState.round === r){
          db.ref(`${ROOT}/rounds/${r}/submissions/${session.code}`).once('value').then(ss=>{
            renderStudentReveal(r, rv, ss.val());
          });
        }
      });
    }
  });
}

function renderRankList(){
  const r = studentState.round;

function moveItem(i,dir){
  const j=i+dir; if(j<0||j>=studentState.order.length) return;
  [studentState.order[i], studentState.order[j]] = [studentState.order[j], studentState.order[i]];

function renderStudentReveal(r, reveal, mySub){
  const body = document.getElementById('student-body');
  let matchHtml = '<p class="lede">이번 라운드는 제출을 못 했어요. 다음 라운드를 기다려주세요!</p>';
  let matchCount = 0;
  if(mySub){
    const rows = mySub.order.map((idx,pos)=>{
      const hit = reveal.order[pos] === idx;
      if(hit) matchCount++;
      const obj = SETS[r-1].items[idx];
      return { text:obj.text, emoji:obj.emoji, pos, hit };
    });
    matchHtml = `<div>${rows.map(row=>`<div class="match-row ${row.hit?'hit':''}">${row.pos+1}위 · <b>${row.text}</b> ${row.emoji} ${row.hit?'🍀 일치!':''}</div>`).join('')}</div>`;
  }
  const revealList = reveal.order.map(idx=>{ const o=SETS[r-1].items[idx]; return `<b>${o.text}</b> ${o.emoji}`; }).join('<br>→ ');
  body.innerHTML = `
    <h2 style="font-family:'Jua'; color:var(--sky-deep);">${r} 라운드</h2>
    <div class="reveal-box">
      <p style="font-weight:700; color:var(--yellow-deep);">🎲 정답 학생: ${reveal.name}</p>
      <p class="lede" style="margin-bottom:10px;">순위: ${revealList}</p>
      ${matchHtml}
    </div>
    <p class="lede waiting-pulse" style="margin-top:14px;">선생님이 다음 라운드를 시작할 때까지 기다려주세요.</p>
  `;
  if(mySub && !studentState.resultShown[r]){
    studentState.resultShown[r] = true;
    db.ref(`${ROOT}/rounds/${r}/results/${session.code}`).set({ name: session.name, matchCount });
  }
}
function refreshMyCloverBadge(){
  let total = {1:0,2:0,3:0};
  [1,2,3].forEach(r=>{
    const ref = db.ref(`${ROOT}/rounds/${r}/results/${session.code}`);
    track(ref, 'value');
    ref.on('value', snap=>{
      const v = snap.val();
      total[r] = v ? (v.matchCount||0) : 0;
      const sum = total[1]+total[2]+total[3];
      document.getElementById('clover-count').textContent = sum;
    });
  });
}

async function finalizeRound(r){

  const pickCode = codes[Math.floor(Math.random()*codes.length)];
  const pick = all[pickCode];
  await db.ref(`${ROOT}/rounds/${r}/reveal`).set({ code: pickCode, name: pick.name, order: pick.order });
  showTeacherRevealOverlay(r, pick);
}

  }
}

    await db.ref(`${ROOT}/game/currentRound`).set(0);
    await db.ref(`${ROOT}/game/currentRound`).set(1);
    showStatus('초기화 완료! 1라운드부터 다시 시작합니다.', 'ok', 3000);
  }catch(e){
    console.error(e);
    showStatus('초기화 중 오류가 발생했어요.', 'bad');
  }
}

// ================= QR 코드 =================
function showQR(){
  const url = window.location.href;
  const isRealUrl = /^https?:\/\//i.test(url);
  const box = document.getElementById('qr-box-content');
  if(!isRealUrl){
    box.innerHTML = `
      <h2 style="font-family:'Jua'; color:var(--sky-deep); font-size:22px;">아직은 QR을 만들 수 없어요</h2>
      <p class="lede" style="text-align:left;">지금 이 화면은 실제 인터넷 주소가 없는 미리보기 상태예요 (주소: <b>${url}</b>).<br><br>
      이 파일을 깃허브(GitHub Pages) 등에 올려서 실제 https:// 주소가 생긴 뒤에 다시 "QR 띄우기"를 눌러주세요.</p>`;
  }else{
    box.innerHTML = `
      <h2 style="font-family:'Jua'; color:var(--sky-deep); font-size:26px;">여기로 접속하세요!</h2>
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=460x460&data=${encodeURIComponent(url)}" alt="QR 코드"
        onerror="this.replaceWith(Object.assign(document.createElement('p'), {className:'qr-link', textContent:'QR 이미지를 불러오지 못했어요. 아래 주소를 직접 입력해주세요.'}))">
      <div class="qr-link">${url}</div>`;
  }
  document.getElementById('qr-modal-bg').classList.add('active');
}
function closeQr(){ document.getElementById('qr-modal-bg').classList.remove('active'); }
function closeQrIfBg(e){ if(e.target.id==='qr-modal-bg') closeQr(); }
</script>
