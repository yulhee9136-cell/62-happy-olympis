<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>소확행 올림픽</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>
<style>
  :root{
    --bg-a:#7B2FF7; --bg-b:#C724D8; --bg-c:#FF4D8D; --bg-d:#FF9A3D;
    --pink:#FF3E8C; --pink-deep:#D91E68;
    --yellow:#FFD400; --yellow-deep:#E0B400;
    --cyan:#00E5D0; --cyan-deep:#00B8A9;
    --lime:#B6FF3B; --lime-deep:#8FDB1A;
    --ink:#1A1030; --paper:#FFFDF7;
    --bad:#FF6B5E; --ok:#33D17A;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; min-height:100vh; }
  body{
    background: linear-gradient(135deg, var(--bg-a) 0%, var(--bg-b) 40%, var(--bg-c) 70%, var(--bg-d) 100%);
    color: var(--paper); font-family:'Gowun Dodum', sans-serif;
    position:relative; overflow-x:hidden;
  }
  .glow{ position:fixed; border-radius:50%; filter:blur(100px); pointer-events:none; z-index:0; }
  .glow.g1{ width:480px; height:480px; top:-200px; left:-160px; background:#fff; opacity:0.5; }
  .glow.g2{ width:420px; height:420px; bottom:-180px; right:-140px; background:var(--yellow); opacity:0.28; }
  .glow.g3{ width:360px; height:360px; top:20%; right:6%; background:var(--cyan); opacity:0.2; }

  .screen{ display:none; position:relative; z-index:1; max-width:1500px; margin:0 auto; padding:22px 24px 70px; }
  .screen.active{ display:block; }
  h1,h2,h3{ margin:0; font-family:'Jua'; }
  .eyebrow{ font-family:'Jua'; font-size:14px; font-weight:700; color:var(--yellow); letter-spacing:1px; text-shadow:0 2px 4px rgba(0,0,0,.25); }
  .lede{ color:#FFF3FA; opacity:.92; font-size:15px; line-height:1.6; margin-top:8px; }

  #status-banner{ display:none; position:sticky; top:0; z-index:200; padding:10px 16px; font-size:14px; text-align:center; font-weight:700; }
  #status-banner.show{ display:block; }
  #status-banner.info{ background:#FFF3D6; color:#8A6A1F; }
  #status-banner.ok{ background:#E4F3E9; color:#1F8C4F; }
  #status-banner.bad{ background:#FBE6E1; color:#B3492F; }

  .sound-toggle{ position:fixed; top:14px; left:14px; z-index:190; width:44px; height:44px; border-radius:50%;
    background:#fff; border:none; display:none; align-items:center; justify-content:center; font-size:19px; cursor:pointer;
    box-shadow:0 4px 10px rgba(0,0,0,.25); }
  .sound-toggle.show{ display:flex; }

  .clover-badge{ position:fixed; top:14px; right:14px; z-index:190; background:#fff; border-radius:22px; padding:9px 18px;
    font-weight:700; color:var(--lime-deep); font-size:17px; box-shadow:0 4px 10px rgba(0,0,0,.25); display:none; align-items:center; gap:6px; }
  .clover-badge.show{ display:flex; }

  .card{ background:#fff; border-radius:20px; padding:22px 20px; margin-top:18px; color:var(--ink);
    box-shadow:0 10px 0 rgba(0,0,0,.22), 0 16px 22px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.8); }

  input[type=tel]{ width:100%; font-family:'Jua'; font-size:28px; letter-spacing:5px; padding:12px 10px;
    border:none; border-bottom:3px solid #e5ddf5; background:transparent; color:var(--ink); outline:none; text-align:center; }
  input[type=tel]:focus{ border-bottom-color:var(--pink); }

  button{ font-family:'Jua'; font-size:17px; padding:14px 28px; border:none; border-radius:26px; cursor:pointer; }
  .btn-primary{ background:linear-gradient(180deg,#FFE24D,var(--yellow-deep)); color:#3A2E00;
    box-shadow:0 6px 0 #A97E00, 0 9px 14px rgba(0,0,0,.3), inset 0 2px 2px rgba(255,255,255,.6); }
  .btn-primary:disabled{ background:linear-gradient(180deg,#8f88a8,#6a637f); color:#c9c4d8; box-shadow:0 6px 0 #4f4964; cursor:not-allowed; }
  .btn-primary:not(:disabled):active{ transform:translateY(5px); box-shadow:0 1px 0 #A97E00; }
  .btn-ghost{ background:rgba(255,255,255,.16); color:#fff; border:2px solid rgba(255,255,255,.5); }
  .btn-danger{ background:#fff; color:var(--bad); border:2px solid var(--bad); }
  .actions{ display:flex; gap:12px; margin-top:22px; flex-wrap:wrap; }

  .code-confirm-name{ font-family:'Jua'; font-size:38px; color:var(--pink); text-align:center; margin:16px 0 4px; text-shadow:0 3px 0 rgba(0,0,0,.15); }

  .round-badge{ font-family:'Jua'; display:inline-block; background:linear-gradient(135deg,var(--pink),var(--pink-deep)); color:#fff; font-size:16px;
    padding:8px 20px; border-radius:20px; box-shadow:0 4px 10px rgba(0,0,0,.25); }

  .lang-bar{ display:flex; gap:8px; margin:14px 0 6px; flex-wrap:wrap; }
  .lang-btn{ padding:7px 15px; border-radius:16px; border:2px solid rgba(255,255,255,.5); background:rgba(255,255,255,.12);
    color:#fff; font-size:13px; cursor:pointer; font-family:'Gowun Dodum'; }
  .lang-btn.on{ background:#fff; color:var(--ink); border-color:#fff; }

  .grid{ display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-top:16px; }
  @media (max-width:680px){ .grid{ grid-template-columns:1fr; } }
  .tile{ position:relative; border-radius:24px; padding:22px 18px 26px; cursor:pointer; user-select:none;
    background: linear-gradient(160deg,#FFFFFF 0%, var(--tint,#F3F0FF) 100%);
    box-shadow:0 12px 0 rgba(0,0,0,.24), 0 18px 24px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.8);
    transition:transform .1s ease; display:flex; flex-direction:column; align-items:center; text-align:center; color:var(--ink); }
  .tile::before{ content:''; position:absolute; top:8px; left:14px; right:14px; height:32%;
    background:linear-gradient(180deg,rgba(255,255,255,.7),rgba(255,255,255,0)); border-radius:18px 18px 36px 36px; pointer-events:none; }
  .tile:active{ transform:translateY(5px); }
  .tile.picked{ box-shadow:0 12px 0 rgba(0,0,0,.24), 0 18px 24px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.8), 0 0 0 5px var(--lime); }
  .tbadge{ position:absolute; top:-14px; right:-14px; width:48px; height:48px; border-radius:50%;
    background:radial-gradient(circle at 32% 28%, #FF6FA8, var(--pink-deep) 75%); color:#fff; display:flex; align-items:center; justify-content:center;
    font-size:22px; border:4px solid #fff; box-shadow:0 5px 8px rgba(0,0,0,.3); opacity:0; transform:scale(.4);
    transition:all .16s cubic-bezier(.34,1.56,.64,1); }
  .tile.picked .tbadge{ opacity:1; transform:scale(1); }
  .ticon{ width:104px; height:104px; margin-bottom:8px; filter:drop-shadow(0 8px 7px rgba(0,0,0,.25)); }
  .tlabel{ font-family:'Jua'; font-size:16.5px; line-height:1.3; }

  .submit-list{ display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  .submit-chip{ font-family:'Jua'; background:#fff; border:2px solid var(--pink); color:var(--pink-deep); border-radius:16px; padding:6px 14px; font-size:14px; font-weight:700; }

  .lobby-list{ display:flex; flex-wrap:wrap; gap:10px; margin-top:18px; }
  .lobby-chip{ font-family:'Jua'; background:#fff; color:var(--ink); border-radius:18px; padding:10px 18px; font-size:16px; font-weight:700;
    box-shadow:0 4px 0 rgba(0,0,0,.15); animation:pop .3s ease; }
  @keyframes pop{ from{ transform:scale(.5); opacity:0; } to{ transform:scale(1); opacity:1; } }

  .waiting-pulse{ display:inline-block; animation:pulse 1.4s infinite; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.4;} }

  .reveal-box{ background:#fff; color:var(--ink); border-radius:18px; padding:22px; margin-top:16px; box-shadow:0 10px 0 rgba(0,0,0,.2); }
  .match-row{ display:flex; justify-content:space-between; padding:9px 4px; border-bottom:1px dashed #e5ddf5; font-size:15px; }
  .match-row.hit{ color:var(--lime-deep); font-weight:700; background:#F1FFDD; border-radius:8px; }

  .overlay{ position:fixed; inset:0; z-index:300; display:none; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; overflow:hidden; }
  .overlay.active{ display:flex; }
  .overlay-bg{ position:absolute; inset:0; z-index:-1;
    background:linear-gradient(135deg, var(--bg-a), var(--bg-c) 60%, var(--bg-d)); }
  .slot-name{ font-family:'Jua'; font-size:clamp(30px,6vw,60px); text-shadow:0 4px 12px rgba(0,0,0,.35); }
  .reveal-congrats{ font-family:'Jua'; font-size:26px; text-shadow:0 3px 8px rgba(0,0,0,.3); }
  .reveal-name{ font-family:'Jua'; font-size:clamp(38px,7vw,64px); margin-top:6px; text-shadow:0 4px 14px rgba(0,0,0,.4); animation:popn .45s ease; }
  @keyframes popn{ from{ transform:scale(.3); opacity:0; } to{ transform:scale(1); opacity:1; } }
  .overlay-order{ background:rgba(255,255,255,.95); color:var(--ink); border-radius:16px; padding:18px 24px; margin-top:20px; max-width:560px; }
  .confetti{ position:absolute; top:-40px; font-size:26px; animation:cfall linear forwards; z-index:2; }
  @keyframes cfall{ to{ transform:translateY(112vh) rotate(360deg); opacity:.2; } }

  .final-wrap{ text-align:center; margin-top:26px; }
  .clover-num{ font-family:'Jua'; font-size:clamp(60px,10vw,110px); color:var(--yellow); text-shadow:0 5px 0 rgba(0,0,0,.25); }
  .clover-field{ display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin-top:18px; max-width:640px; margin-left:auto; margin-right:auto; }
  .clover-field span{ font-size:30px; animation:pop .35s ease; }

  .modal-bg{ display:none; position:fixed; inset:0; background:rgba(20,10,35,.6); align-items:center; justify-content:center; padding:20px; z-index:250; }
  .modal-bg.active{ display:flex; }
  .modal-inner{ max-width:420px; width:100%; }
  .top-nav{ display:flex; justify-content:space-between; align-items:center; }
  .link-btn{ background:none; border:none; color:#fff; opacity:.85; font-size:13px; cursor:pointer; text-decoration:underline; padding:0; font-family:'Gowun Dodum'; }
</style>
</head>
<body>
<div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div>
<div id="status-banner"></div>
<button class="sound-toggle" id="sound-toggle" onclick="toggleSound()">🔊</button>
<div class="clover-badge" id="clover-badge">🍀 <span id="clover-count">0</span></div>

<!-- 0. 접속코드 -->
<div class="screen active" id="screen-code">
  <div class="eyebrow">국어 · 행복 발견하기</div>
  <h1 style="font-size:38px;">🔥 소확행 올림픽</h1>
  <p class="lede">선생님이 알려주신 접속코드를 입력해주세요.</p>
  <div class="card">
    <input type="tel" id="input-code" placeholder="0000" maxlength="4" inputmode="numeric">
    <div class="actions" style="justify-content:center;"><button class="btn-primary" onclick="checkCode()">확인</button></div>
  </div>
</div>

<!-- 0-1. 본인 확인 -->
<div class="screen" id="screen-confirm">
  <div class="card" style="text-align:center;">
    <p class="lede" style="margin-top:0; color:var(--ink);">이 접속코드는</p>
    <div class="code-confirm-name" id="confirm-name">-</div>
    <p class="lede" style="color:var(--ink);">님의 코드가 맞나요?</p>
    <div class="actions" style="justify-content:center;">
      <button class="btn-primary" onclick="confirmYes()">예, 맞아요</button>
      <button class="btn-ghost" style="color:var(--ink); border-color:#ccc;" onclick="confirmNo()">아니오</button>
    </div>
  </div>
</div>

<!-- 1. 학생 화면 -->
<div class="screen" id="screen-student">
  <div class="top-nav">
    <span class="round-badge" id="student-round-badge">대기 중</span>
    <button class="link-btn" onclick="logout()">로그아웃</button>
  </div>
  <div id="student-body" style="margin-top:16px;"></div>
</div>

<!-- 2. 교사 화면 -->
<div class="screen" id="screen-teacher">
  <div class="top-nav">
    <span class="round-badge" id="teacher-round-badge">대기실</span>
    <div style="display:flex; gap:8px; flex-wrap:wrap;">
      <button class="btn-ghost" onclick="showQR()">📱 QR</button>
      <button class="btn-danger" onclick="askReset()">🔄 초기화</button>
      <button class="link-btn" onclick="logout()">로그아웃</button>
    </div>
  </div>
  <h1 style="font-size:28px; margin-top:12px;">교사 진행 화면</h1>
  <div id="teacher-body" style="margin-top:10px;"></div>
</div>

<!-- 당첨 발표 오버레이 -->
<div class="overlay" id="reveal-overlay">
  <div class="overlay-bg"></div>
  <div id="overlay-content"></div>
</div>

<!-- QR 모달 -->
<div class="modal-bg" id="qr-modal-bg" onclick="closeQrIfBg(event)">
  <div class="modal-inner"><div class="card" id="qr-box-content" style="text-align:center;"></div>
    <div style="text-align:center; margin-top:12px;"><button class="btn-ghost" onclick="closeQr()">닫기</button></div>
  </div>
</div>

<!-- 초기화 확인 모달 -->
<div class="modal-bg" id="reset-confirm-bg">
  <div class="modal-inner"><div class="card" style="text-align:center;">
    <p class="lede" style="margin-top:0; font-size:16px; color:var(--ink);">정말 초기화할까요?<br>게임 기록과 모든 학생의 클로버 잔액이 함께 초기화돼요.</p>
    <div class="actions" style="justify-content:center;">
      <button class="btn-danger" onclick="doReset()">초기화</button>
      <button class="btn-ghost" style="color:var(--ink); border-color:#ccc;" onclick="closeResetConfirm()">취소</button>
    </div>
  </div></div>
</div>

<!-- 사운드 -->
<audio id="sfxPop" src="sfx/pop.mp3" preload="auto"></audio>
<audio id="sfxDrumroll" src="sfx/drumroll.mp3" preload="auto"></audio>
<audio id="sfxTada" src="sfx/tada.mp3" preload="auto"></audio>
<audio id="sfxCheer" src="sfx/cheer.mp3" preload="auto"></audio>
<audio id="sfxSparkle" src="sfx/sparkle.mp3" preload="auto"></audio>

let soundOn = true;
const el = id => document.getElementById(id);
function playFromStart(a){ if(!soundOn) return; try{ a.currentTime=0; a.play().catch(()=>{}); }catch(e){} }
function stopSound(a){ try{ a.pause(); a.currentTime=0; }catch(e){} }
function toggleSound(){
  soundOn = !soundOn;
  el('sound-toggle').textContent = soundOn ? '🔊' : '🔇';
  if(!soundOn) stopSound(el('sfxBgm')); else playFromStart(el('sfxBgm'));
}
function startBgm(){ const a=el('sfxBgm'); a.volume=0.35; if(soundOn) playFromStart(a); }
function stopBgm(){ stopSound(el('sfxBgm')); }

let session = null;
let pendingCode = null;
function showScreen(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); document.getElementById(id).classList.add('active'); window.scrollTo(0,0); }

function checkCode(){
  const code = document.getElementById('input-code').value.trim();
  if(!/^\d{4}$/.test(code)){ showStatus('4자리 숫자 코드를 입력해주세요.','bad',2500); return; }
  const name = CODES[code];
  if(!name){ showStatus('등록되지 않은 코드예요.','bad',3000); return; }
  pendingCode = code;
  document.getElementById('confirm-name').textContent = name;
  showScreen('screen-confirm');
}
function confirmYes(){
  const code = pendingCode;
  session = { code, name: CODES[code], isTeacher: code===TEACHER_CODE };
  document.getElementById('input-code').value = '';
  if(session.isTeacher){
    startBgm();
    el('sound-toggle').classList.add('show');
    showScreen('screen-teacher');
    initTeacher();
  }else{
    el('clover-badge').classList.add('show');
    showScreen('screen-student');
    initStudent();
  }
}
function confirmNo(){ pendingCode=null; document.getElementById('input-code').value=''; showScreen('screen-code'); }

let listeners = [];
function track(ref,ev){ listeners.push({ref,ev}); }
function detachAll(){ listeners.forEach(l=>l.ref.off(l.ev)); listeners=[]; }
function logout(){
  session=null; detachAll(); stopBgm();
  el('clover-badge').classList.remove('show');
  el('sound-toggle').classList.remove('show');
  showScreen('screen-code');
}

let studentState = { round:1, order:[], resultShown:{} };

function initStudent(){
  db.ref(`presence/${session.code}`).set({ name: session.name, ts: Date.now() });
  const gameRef = db.ref(`${ROOT}/game/currentRound`);
  track(gameRef,'value');
  gameRef.on('value', snap=>{
    const r = snap.val() || 'lobby';
    if(r === 'lobby'){ renderStudentLobby(); return; }
    if(r === 'final'){ showStudentFinal(); return; }
    document.getElementById('student-round-badge').textContent = `${r} 라운드`;
    loadStudentRound(r);
  });
  refreshCloverBadge();
}
function renderStudentLobby(){
  document.getElementById('student-round-badge').textContent = '대기실';
  document.getElementById('student-body').innerHTML = `
    <div class="card" style="text-align:center;">
      <h2 style="font-size:22px;">🎉 입장 완료!</h2>
      <p class="lede waiting-pulse" style="color:var(--ink);">선생님이 게임을 시작하면 자동으로 1라운드가 시작돼요.</p>
    </div>`;
}
function refreshCloverBadge(){
  const ref = db.ref(`wallet/${session.code}`);
  track(ref,'value');
  ref.on('value', snap=>{ document.getElementById('clover-count').textContent = Number(snap.val())||0; });
}

function loadStudentRound(r){
  studentState = { round:r, order:[], resultShown:{} };
  const subRef = db.ref(`${ROOT}/rounds/${r}/submissions/${session.code}`);
  const revealRef = db.ref(`${ROOT}/rounds/${r}/reveal`);
  Promise.all([subRef.once('value'), revealRef.once('value')]).then(([subSnap, revealSnap])=>{
    const mySub = subSnap.val();
    const reveal = revealSnap.val();
    if(mySub) studentState.order = mySub.order.slice();
    if(reveal){ renderStudentReveal(r, reveal, mySub); }
    else if(mySub){ renderStudentWaiting(r); }
    else{ renderRankingUI(r); }
    if(!reveal){
      const rr = db.ref(`${ROOT}/rounds/${r}/reveal`);
      track(rr,'value');
      rr.on('value', s=>{
        const rv = s.val();
        if(rv && studentState.round===r){
          db.ref(`${ROOT}/rounds/${r}/submissions/${session.code}`).once('value').then(ss=>{ renderStudentReveal(r, rv, ss.val()); });
        }
      });
    }
  });
}

function renderLangBar(){
  const langs = [['ko','한국어'],['en','English'],['ru','Русский'],['zh','中文']];
  return `<div class="lang-bar" id="lang-bar">${langs.map(([c,l])=>`<button class="lang-btn ${uiLang===c?'on':''}" onclick="setLang('${c}')">${l}</button>`).join('')}</div>`;
}
function setLang(code){ uiLang=code; renderRankingUI(studentState.round); }

function renderRankingUI(r){
  const body = document.getElementById('student-body');
  const items = SETS[r-1].items;
  body.innerHTML = `
    <h2 style="font-size:24px;">${r} 라운드 — 순서를 정해보세요</h2>
    <p class="lede">누른 순서대로 1·2·3·4번이 매겨져요. 같은 칸을 다시 누르면 취소돼요.</p>
    ${renderLangBar()}
    <div class="grid" id="tile-grid"></div>
    <div class="actions"><button class="btn-primary" id="submit-btn" disabled onclick="submitRank()">제출하기</button></div>
  `;
  const grid = document.getElementById('tile-grid');
  grid.innerHTML = items.map((it,idx)=>`
    <div class="tile" style="--tint:${TINTS[idx]}" data-idx="${idx}" onclick="tapTile(${idx})">
      <div class="tbadge">${'\u200b'}</div>
      ${icon(it.key)}
      <div class="tlabel">${itemText(r, idx)}</div>
    </div>`).join('');
  paintTiles();
}
function tapTile(idx){
  const pos = studentState.order.indexOf(idx);
  if(pos===-1){ if(studentState.order.length<4) studentState.order.push(idx); }
  else{ studentState.order.splice(pos,1); }
  playFromStart(el('sfxPop'));
  paintTiles();
}
function paintTiles(){
  document.querySelectorAll('.tile').forEach(tile=>{
    const idx = +tile.dataset.idx;
    const pos = studentState.order.indexOf(idx);
    const badge = tile.querySelector('.tbadge');
    if(pos===-1){ tile.classList.remove('picked'); }
    else{ tile.classList.add('picked'); badge.textContent = pos+1; }
  });
  const btn = document.getElementById('submit-btn');
  if(btn) btn.disabled = studentState.order.length < 4;
}
async function submitRank(){
  const r = studentState.round;
  try{
    await db.ref(`${ROOT}/rounds/${r}/submissions/${session.code}`).set({ name:session.name, order:studentState.order.slice(), ts:Date.now() });
    renderStudentWaiting(r);
  }catch(e){ console.error(e); showStatus('제출 중 오류가 발생했어요.','bad'); }
}
function renderStudentWaiting(r){
  document.getElementById('student-body').innerHTML = `
    <h2 style="font-size:22px;">${r} 라운드</h2>
    <div class="card" style="text-align:center;">
      <p class="lede waiting-pulse" style="color:var(--ink); font-size:16px;">✅ 제출 완료! 선생님이 마무리할 때까지 기다려주세요.</p>
    </div>`;
}
async function renderStudentReveal(r, reveal, mySub){
  let matchHtml = '<p class="lede" style="color:var(--ink);">이번 라운드는 제출을 못 했어요. 다음 라운드를 기다려주세요!</p>';
  let matchCount = 0;
  if(mySub){
    const rows = mySub.order.map((idx,pos)=>{
      const hit = reveal.order[pos]===idx;
      if(hit) matchCount++;
      return { text: SETS[r-1].items[idx].ko, pos, hit };
    });
    matchHtml = rows.map(row=>`<div class="match-row ${row.hit?'hit':''}">${row.pos+1}위 · ${row.text} ${row.hit?'🍀':''}</div>`).join('');
  }
  document.getElementById('student-body').innerHTML = `
    <h2 style="font-size:22px;">${r} 라운드</h2>
    <div class="reveal-box">
      <p style="font-weight:700; color:var(--pink-deep);">🎲 정답 학생: ${reveal.name}</p>
      ${matchHtml}
    </div>
    <p class="lede waiting-pulse" style="margin-top:14px;">선생님이 다음 라운드를 시작할 때까지 기다려주세요.</p>`;
  if(mySub && !studentState.resultShown[r]){
    studentState.resultShown[r] = true;
    await db.ref(`${ROOT}/rounds/${r}/results/${session.code}`).set({ name:session.name, matchCount });
    if(matchCount>0){
      const wref = db.ref(`wallet/${session.code}`);
      const cur = (await wref.once('value')).val() || 0;
      await wref.set(Number(cur) + matchCount);
    }
  }
}
async function showStudentFinal(){
  document.getElementById('student-round-badge').textContent = '게임 종료';
  const snap = await db.ref(`wallet/${session.code}`).once('value');
  const total = Number(snap.val())||0;
  let msg = '소소하지만 확실한 행운이었어요 🍀';
  if(total>=7) msg = '네잎클로버 마스터예요! 🌟';
  else if(total>=4) msg = '행운 부자네요! 🍀🍀';
  document.getElementById('student-body').innerHTML = `
    <div class="final-wrap">
      <div class="eyebrow">3라운드 완료!</div>
      <h1 style="font-size:28px; margin-top:8px;">내가 모은 네잎클로버</h1>
      <div class="clover-num">🍀 ${total}</div>
      <p class="lede" style="font-size:17px;">${msg}</p>

  playFromStart(el('sfxSparkle'));
}

async function finalizeRound(r){
  const snap = await db.ref(`${ROOT}/rounds/${r}/submissions`).once('value');

  const pickCode = codes[Math.floor(Math.random()*codes.length)];
  const pick = all[pickCode];
  const allNames = codes.map(c=>all[c].name);
  showRevealOverlay(r, pick, allNames, async ()=>{
    await db.ref(`${ROOT}/rounds/${r}/reveal`).set({ code:pickCode, name:pick.name, order:pick.order });
  });

  if(r<3) await db.ref(`${ROOT}/game/currentRound`).set(r+1);
  else await db.ref(`${ROOT}/game/currentRound`).set('final');

// ===================== 당첨 발표 연출 (슬롯머신 + 사운드) =====================
function showRevealOverlay(r, pick, allNames, onLanded){
  const overlay = document.getElementById('reveal-overlay');
  const content = document.getElementById('overlay-content');
  const pool = allNames.length ? allNames : [pick.name];
  content.innerHTML = `<div class="slot-name" id="slot-name">${pool[0]}</div><p class="lede">두구두구두구...</p>`;
  overlay.classList.add('active');
  stopBgm();
  playFromStart(el('sfxDrumroll'));

  let elapsed = 0, interval = 70;
  const totalMs = 3400;
  const nameEl = document.getElementById('slot-name');
  function tick(){
    elapsed += interval;
    if(elapsed >= totalMs){
      nameEl.textContent = pick.name;
      stopSound(el('sfxDrumroll'));
      setTimeout(()=> revealPhase(r, pick, onLanded), 250);
      return;
    }
    nameEl.textContent = pool[Math.floor(Math.random()*pool.length)];
    interval = Math.min(280, interval*1.16);
    setTimeout(tick, interval);
  }
  tick();
}
async function revealPhase(r, pick, onLanded){
  await onLanded();
  const content = document.getElementById('overlay-content');
  content.innerHTML = `
    <div class="reveal-congrats">🎉 축하합니다 🎉</div>
    <div class="reveal-name">${pick.name}</div>
    <div class="overlay-order">
      <p class="lede" style="margin-top:0; color:var(--ink);">이 친구가 정한 순위</p>
      <p style="font-size:16px; line-height:1.7; color:var(--ink);">${pick.order.map(i=>SETS[r-1].items[i].ko).join('<br>→ ')}</p>
    </div>
    <div class="actions" style="justify-content:center; margin-top:22px;">
      <button class="btn-primary" onclick="advanceFromOverlay(${r})">${r<3? '다음 라운드로' : '게임 종료하기'}</button>
    </div>`;
  playFromStart(el('sfxTada'));
  playFromStart(el('sfxCheer'));
  spawnConfetti(34);
}
function advanceFromOverlay(r){
  closeOverlay();
  nextRound(r);
}
function spawnConfetti(n){
  const overlay = document.getElementById('reveal-overlay');
  const em = ['🎉','✨','🎊','⭐️','🍀'];
  for(let i=0;i<n;i++){
    const s = document.createElement('span'); s.className='confetti'; s.textContent=em[Math.floor(Math.random()*em.length)];
    s.style.left = (Math.random()*100)+'vw'; s.style.animationDuration=(2.2+Math.random()*1.6)+'s'; s.style.animationDelay=(Math.random()*.6)+'s';
    overlay.appendChild(s);
  }
}
function closeOverlay(){
  document.getElementById('reveal-overlay').classList.remove('active');
  document.querySelectorAll('.confetti').forEach(e=>e.remove());
  stopSound(el('sfxDrumroll'));
  if(soundOn) playFromStart(el('sfxBgm'));
}

// ===================== 초기화 =====================
function askReset(){ document.getElementById('reset-confirm-bg').classList.add('active'); }
function closeResetConfirm(){ document.getElementById('reset-confirm-bg').classList.remove('active'); }
async function doReset(){
  closeResetConfirm();
  showStatus('초기화하는 중...','info');
  try{
    await db.ref(`${ROOT}/rounds`).remove();
    await db.ref('wallet').remove();
    await db.ref('given').remove();
    await db.ref('presence').remove();
    await db.ref(`${ROOT}/game/currentRound`).set('__resetting__');
    await db.ref(`${ROOT}/game/currentRound`).set('lobby');
    showStatus('초기화 완료!','ok',3000);
  }catch(e){ console.error(e); showStatus('초기화 중 오류가 발생했어요.','bad'); }
}

// ===================== QR =====================
function showQR(){
  const url = window.location.href;
  const isReal = /^https?:\/\//i.test(url);
  const box = document.getElementById('qr-box-content');
  if(!isReal){
    box.innerHTML = `<h3 style="color:var(--pink-deep);">아직은 QR을 만들 수 없어요</h3><p class="lede" style="color:var(--ink);">지금은 실제 인터넷 주소가 없는 미리보기예요. 깃허브에 올린 뒤 다시 눌러주세요.</p>`;
  }else{
    box.innerHTML = `<h3 style="color:var(--pink-deep);">여기로 접속하세요!</h3>
      <img style="width:100%; max-width:300px;" src="https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=${encodeURIComponent(url)}"
        onerror="this.replaceWith(Object.assign(document.createElement('p'),{textContent:'QR을 불러오지 못했어요: '+'${url}'}))">
      <p style="font-size:12px; color:#7a7391; word-break:break-all;">${url}</p>`;
  }
  document.getElementById('qr-modal-bg').classList.add('active');
}
function closeQr(){ document.getElementById('qr-modal-bg').classList.remove('active'); }
function closeQrIfBg(e){ if(e.target.id==='qr-modal-bg') closeQr(); }
</script>
